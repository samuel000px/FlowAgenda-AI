name: Testes do site

on:
  push:
    paths-ignore: ["agente-remarcacao/**", "**.md"]
  pull_request:
    paths-ignore: ["agente-remarcacao/**", "**.md"]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm run install:ci
      # os testes não chamam o Gemini nem o WhatsApp, então não precisam de chave
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
